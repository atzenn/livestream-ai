# livestream-ai config - copy to config.yaml and edit.
# NEVER put secrets in this file. YouTube OAuth is a file path,
# OBS password comes from the OBS_WS_PASSWORD env var.
language: vi

tts:
  engine: vieneu        # vieneu | vieneu-pc | piper | mock
  voice: "Hải Đăng"    # VieNeu preset voice (North/Central/South)
  precision: fp32       # fp32 | int8 (CPU only)
  sample_rate: 48000
  piper_voice_path: "models/piper/vi_VN-25hours_single-low.onnx"
  onnx_dir: "models/vieneu-onnx"  # local VieNeu ONNX files (fp32)
  codec_dir: "models/moss-codec"  # local MOSS codec ONNX files
  # VieNeu-TTS on Zen's PC via its MCP server (port 8790).
  # Default OFF: the access path is arranged by the Leader. The
  # tool is the real text_to_speech (Leader tin 7485): it takes
  # text, voice id (e.g. local:Hải Đăng, omit for server default),
  # file_name, folder and speed - and NO model argument. It returns
  # the file path in the VieNeu library on the PC + a browser
  # listen link, not audio bytes. Host can also come from env
  # LIVESTREAM_PC_HOST. No credential goes here.
  pc_mcp_enabled: false
  pc_mcp_host: ""
  pc_mcp_port: 8790
  pc_mcp_path: "/mcp"
  pc_mcp_tool: "text_to_speech"
  pc_mcp_folder: ""      # optional VieNeu library folder
  pc_mcp_speed: null     # optional speech speed; null = server default
  pc_mcp_timeout_s: 60
  pc_mcp_status_timeout_s: 120  # max wait polling get_speech_status
  pc_mcp_poll_interval_s: 2.0

avatar:
  engine: "null"        # "null" (dry run) | musetalk (GPU box only)
  livetalking_path: ""  # LiveTalking checkout on the GPU box
  checkpoint_dir: ""    # MuseTalk weights (~4 GB) on the GPU box
  avatar_bundle: ""     # prepared avatar bundle on the GPU box

obs:
  host: localhost
  port: 4455
  scene_live: Live
  scene_human: Human
  overlay_source: "AI Disclosure"

youtube:
  client_secrets_path: ""  # OAuth client secrets JSON (operator's own)
  token_path: ""           # OAuth token cache (created on first run)
  privacy_status: unlisted # unlisted for tests, public for real
  latency: low             # normal | low | ultra-low
  default_title: ""
  default_description: ""

compliance:
  disclosure_overlay: "Nội dung AI - Avatar AI đang nói"
  log_path: "logs/spoken.jsonl"
  block_medical_claims: true
  block_before_after: true
  block_impersonation: true
